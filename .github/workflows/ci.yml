name: Basic checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_release.py
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install BacRootFit
        run: python -m pip install -e .
      - name: Run and verify CPU prediction
        run: |
          bacrootfit predict --input examples/synthetic.faa --features examples/synthetic_features.npz --model prott5_svm --output example_output.tsv
          python scripts/check_cpu_example.py example_output.tsv
